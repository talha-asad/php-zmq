name: Build php-zmq for PHP 8.5

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64]
        ts: [nts, ts]
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          repository: zeromq/php-zmq
          ref: master

      - name: Build the extension
        uses: php/php-windows-builder/extension@29352c0   # pinned to v1.9.0 (before -1 rebuilds)
        with:
          php-version: '8.5.12'
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          libs: libzmq

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_zmq-${{ matrix.ts }}-${{ matrix.arch }}
          path: |
            **/*.dll
            **/*.pdb
